services:
  cleartax_nodejs:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: cleartax_nodejs
    ports:
      - "3001:3000"
    volumes:
      - ./server/src:/app/src
      - ./server/package.json:/app/package.json
      - ./.env:/app/.env
    command: node --watch --experimental-strip-types --env-file=./.env src/index.ts
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - S3_ENDPOINT=${GARAGE_ENDPOINT}
      - S3_REGION=${GARAGE_REGION}
      - AWS_ACCESS_KEY_ID=${GARAGE_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${GARAGE_SECRET_KEY}

  cleartax_react:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: development
    container_name: cleartax_react
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0
    stdin_open: true
    tty: true
    depends_on:
      - cleartax_nodejs

  postgres:
    image: postgres:16-alpine
    container_name: cleartax_postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: cleartax_pgadmin
    ports:
      - "5055:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: always

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: cleartax_garage
    restart: always
    ports:
      - "3910:3900" # S3 API
      - "3911:3901" # RPC communication
      - "3912:3902" # S3 Web
    volumes:
      - ./garage.toml:/etc/garage.toml
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

volumes:
  postgres_data:
  pgadmin_data:
  garage_meta:
  garage_data:
